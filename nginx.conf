worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;

        # Healthcheck directo para Railway
        location = /health {
            access_log off;
            return 200 'healthy\n';
        }

        # 1. Rutas de API y Webhooks (FastAPI en puerto interno 8001)
        location /api/ {
            proxy_pass http://127.0.0.1:8001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Documentación Swagger de FastAPI
        location /docs {
            proxy_pass http://127.0.0.1:8001/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://127.0.0.1:8001/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 2. Rutas del Dashboard Streamlit (puerto interno 8502) y WebSockets
        location / {
            proxy_pass http://127.0.0.1:8502/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
